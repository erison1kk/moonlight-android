name: Build Moonlight Android APK

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          echo "y" | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;29.0.14206865"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug and Release APKs
        run: |
          ./gradlew assembleNonRootDebug assembleNonRootRelease --stacktrace

      - name: Sign Release APK with Debug Key (for easy installation)
        run: |
          # If the release APK is unsigned, sign it with the debug keystore so users can install it immediately
          RELEASE_APK=$(find app/build/outputs/apk/nonRoot/release -name "*.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ]; then
            DEBUG_KEYSTORE="$HOME/.android/debug.keystore"
            if [ ! -f "$DEBUG_KEYSTORE" ]; then
              mkdir -p "$HOME/.android"
              keytool -genkey -v -keystore "$DEBUG_KEYSTORE" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore "$DEBUG_KEYSTORE" -storepass android "$RELEASE_APK" androiddebugkey || true
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight-NonRoot-Debug
          path: app/build/outputs/apk/nonRoot/debug/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight-NonRoot-Release
          path: app/build/outputs/apk/nonRoot/release/*.apk
